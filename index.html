    giro:      ["nombre_act", "actividad", "giro", "scian", "clase_actividad", "codigo_act"],
    empleados: ["per_ocu", "personal", "ocupado", "empleados", "estrato", "tamaño", "tamano"],
    telefono:  ["telefono", "teléfono", "tel", "phone", "celular", "movil", "móvil", "contacto_tel"],
    correo:    ["correoelec", "correo", "email", "e-mail", "mail"],
    municipio: ["municipio", "mun", "localidad", "ciudad"],
    direccion: ["calle", "direccion", "dirección", "domicilio", "ubicacion", "ubicación"],
  };
  const norm = (s) => String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  const detectarColumna = (campo, headers) => {
    const hints = COL_HINTS[campo] || [];
    for (const h of hints) { const found = headers.find((col) => norm(col) === norm(h)); if (found) return found; }
    for (const h of hints) { const found = headers.find((col) => norm(col).includes(norm(h))); if (found) return found; }
    return "";
  };
  // Interpreta el "personal ocupado" de DENUE (rangos de texto) a un rango numérico [min,max].
  const parseEstrato = (txt) => {
    const s = norm(txt);
    if (!s) return null;
    const nums = (s.match(/\d+/g) || []).map(Number);
    if (s.includes("y mas") || s.includes("y más") || s.includes("251") || s.includes("o mas")) { return { min: nums[0] || 251, max: 99999 }; }
    if (nums.length >= 2) return { min: nums[0], max: nums[1] };
    if (nums.length === 1) return { min: nums[0], max: nums[0] };
    return null;
  };

  function BaseDatos({ data, upsert, setTab }) {
    const [paso, setPaso] = useState("inicio"); // inicio | mapeo | revision
    const [fileName, setFileName] = useState("");
    const [headers, setHeaders] = useState([]);
    const [rows, setRows] = useState([]);
    const [mapeo, setMapeo] = useState({ nombre: "", giro: "", empleados: "", telefono: "", correo: "", municipio: "", direccion: "" });
    const [driveLink, setDriveLink] = useState("");
    const [empMin, setEmpMin] = useState(20);
    const [empMax, setEmpMax] = useState(300);
    const [girosSel, setGirosSel] = useState({});   // giro -> bool (aceptado)
    const [procesado, setProcesado] = useState(null); // { auto, revision, descartados, duplicados }
    const [revSel, setRevSel] = useState({});       // idx -> bool (aprobar de la zona de revisión)
    const [err, setErr] = useState("");
    const fileRef = React.useRef(null);

    const reset = () => { setPaso("inicio"); setFileName(""); setHeaders([]); setRows([]); setDriveLink(""); setProcesado(null); setRevSel({}); setGirosSel({}); setErr(""); if (fileRef.current) fileRef.current.value = ""; };

    // Lee el archivo en memoria (no se persiste el crudo). Soporta CSV y Excel.
    const onFile = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setErr(""); setFileName(file.name);
      const esCSV = /\.csv$/i.test(file.name);
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          let wb;
          if (esCSV) {
            // CSV de DENUE suele venir en Latin1 (Windows-1252). codepage 1252 conserva acentos/ñ.
            wb = XLSX.read(ev.target.result, { type: "array", codepage: 1252, raw: false });
          } else {
            wb = XLSX.read(ev.target.result, { type: "array" });
          }
          const ws = wb.Sheets[wb.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(ws, { defval: "" });
          if (!json.length) { setErr("El archivo está vacío o no tiene filas de datos."); return; }
          const hs = Object.keys(json[0]);
          setHeaders(hs);
          setRows(json);
          setMapeo({
            nombre: detectarColumna("nombre", hs), giro: detectarColumna("giro", hs), empleados: detectarColumna("empleados", hs),
            telefono: detectarColumna("telefono", hs), correo: detectarColumna("correo", hs),
            municipio: detectarColumna("municipio", hs), direccion: detectarColumna("direccion", hs),
          });
          setPaso("mapeo");
        } catch (ex) { console.error(ex); setErr("No pude leer el archivo. ¿Es un CSV o Excel válido?"); }
      };
      reader.readAsArrayBuffer(file);
    };

    // Giros únicos detectados (para que el usuario elija cuáles aceptar).
    const girosUnicos = useMemo(() => {
      if (!mapeo.giro) return [];
      const map = {};
      rows.forEach((r) => { const g = String(r[mapeo.giro] || "").trim(); if (g) map[g] = (map[g] || 0) + 1; });
      return Object.entries(map).map(([g, n]) => ({ giro: g, n })).sort((a, b) => b.n - a.n);
    }, [rows, mapeo.giro]);

    const irARevision = () => {
      if (!mapeo.nombre) { setErr("Indica al menos la columna de Nombre del negocio."); return; }
      if (!driveLink.trim()) { setErr("El link de Drive es obligatorio para registrar la carga."); return; }
      // Inicializa giros: todos aceptados por defecto (el usuario desmarca los que no).
      const init = {}; girosUnicos.forEach((g) => { init[g.giro] = true; });
      setGirosSel(init);
      setErr("");
      procesar(init);
      setPaso("revision");
    };

    // Aplica los 3 umbrales: auto a Leads / revisión / descarte.
    const procesar = (girosAceptados) => {
      const existentesTel = new Set(data.contacts.map((c) => norm(c.telefono)).filter(Boolean));
      const existentesMail = new Set(data.contacts.map((c) => norm(c.email)).filter(Boolean));
      const auto = [], revision = [], descartados = [];
      let duplicados = 0;
      const vistosTel = new Set(), vistosMail = new Set();

      rows.forEach((r, i) => {
        const nombre = String(r[mapeo.nombre] || "").trim();
        if (!nombre) return;
        const tel = mapeo.telefono ? String(r[mapeo.telefono] || "").trim() : "";
        const mail = mapeo.correo ? String(r[mapeo.correo] || "").trim() : "";
        const giro = mapeo.giro ? String(r[mapeo.giro] || "").trim() : "";
        const empTxt = mapeo.empleados ? String(r[mapeo.empleados] || "").trim() : "";
        const muni = mapeo.municipio ? String(r[mapeo.municipio] || "").trim() : "";

        // Duplicado (contra Leads existentes o dentro del mismo archivo)
        const nTel = norm(tel), nMail = norm(mail);
        const dupExist = (nTel && existentesTel.has(nTel)) || (nMail && existentesMail.has(nMail));
        const dupInterno = (nTel && vistosTel.has(nTel)) || (nMail && vistosMail.has(nMail));
        if (dupExist || dupInterno) { duplicados++; return; }
        if (nTel) vistosTel.add(nTel); if (nMail) vistosMail.add(nMail);

        const lead = { nombre, telefono: tel, correo: mail, giro, empTxt, municipio: muni, tipo: "privada" };

        // Criterio giro
        const giroOK = !giro || girosAceptados[giro] !== false;
        if (giro && girosAceptados[giro] === false) { descartados.push({ ...lead, motivo: "Giro excluido" }); return; }
        // Criterio contacto
        const tieneTel = !!tel, tieneMail = !!mail;
        if (!tieneTel && !tieneMail) { descartados.push({ ...lead, motivo: "Sin datos de contacto" }); return; }
        // Criterio tamaño
        const rango = parseEstrato(empTxt);
        const tamOK = !rango ? null : (rango.max >= empMin && rango.min <= empMax);

        // Decisión de umbral
        const completo = tieneTel && tieneMail;
        if (completo && giroOK && tamOK === true) { auto.push({ ...lead, motivo: "Cumple todo" }); }
        else { // a revisión, con la razón de la duda
          const dudas = [];
          if (!completo) dudas.push(tieneTel ? "sin correo" : "sin teléfono");
          if (tamOK === null) dudas.push("tamaño no detectado");
          if (tamOK === false) dudas.push("fuera de rango de empleados");
          revision.push({ ...lead, motivo: dudas.join(" · ") || "revisar" });
        }
      });
      setProcesado({ auto, revision, descartados, duplicados });
      // Por defecto, los de revisión NO van seleccionados (el usuario decide).
      const rs = {}; revision.forEach((_, i) => { rs[i] = false; }); setRevSel(rs);
    };

    // Reprocesa al cambiar giros / rango (en vivo dentro de revisión).
    const reprocesar = () => procesar(girosSel);

    const confirmarImport = () => {
      if (!procesado) return;
      const loteId = uid();
      const aprobadosRev = procesado.revision.filter((_, i) => revSel[i]);
      const todos = [...procesado.auto, ...aprobadosRev];
      todos.forEach((l) => {
        upsert("contacts", { id: uid(), nombre: l.nombre, empresa: l.nombre, puesto: "", email: l.correo || "", telefono: l.telefono || "", tipo: l.tipo || "privada", giro: l.giro || "", municipio: l.municipio || "", estado: "activo", lote: loteId, notas: "" });
      });
      upsert("imports", { id: loteId, archivo: fileName, fecha: new Date().toISOString(), driveLink: driveLink.trim(), total: rows.length, importados: todos.length, auto: procesado.auto.length, revisados: aprobadosRev.length, duplicados: procesado.duplicados, descartados: procesado.descartados.length });
      reset();
      setTab("leads");
    };

    const registros = (data.imports || []).slice().sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));

    // ----- Render -----
    return (
      <div className="space-y-5">
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-xl font-bold tracking-tight text-slate-900">Base de Datos</h2>
            <p className="mt-0.5 text-sm text-slate-500">Importa un Excel, críbalo y envía los Leads aprobados.</p>
          </div>
          {paso !== "inicio" && <button onClick={reset} className="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-500 hover:bg-slate-50">Cancelar</button>}
        </div>

        {err && <div className="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">{err}</div>}

        {/* PASO 1: subir archivo */}
        {paso === "inicio" && (
          <div className="grid gap-4 lg:grid-cols-2">
            <div className="rounded-2xl border-2 border-dashed border-slate-300 bg-white p-8 text-center transition-colors hover:border-[#1B3A6B]/50">
              <div className="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl" style={{ backgroundColor: BRAND.teal + "14" }}><Icon n="database" s={22} style={{ color: BRAND.teal }} /></div>
              <h3 className="text-sm font-semibold text-slate-700">Importar Excel</h3>
              <p className="mx-auto mt-1 max-w-xs text-xs text-slate-400">Sube un .csv o .xlsx (ej. exportación de DENUE). El sistema detecta columnas, filtra y cría a Leads. El archivo no se almacena.</p>
              <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={onFile} className="hidden" id="excel-input" />
              <label htmlFor="excel-input" className="mt-4 inline-flex cursor-pointer items-center gap-1.5 rounded-lg px-4 py-2 text-sm font-medium text-white bg-[#1B3A6B] hover:bg-[#132a4d]"><Icon n="download" s={14} /> Elegir archivo</label>
            </div>
            <div className="rounded-2xl border border-slate-200 bg-white p-6">
              <h3 className="mb-1 text-sm font-semibold text-slate-700">Registro de cargas</h3>
              <p className="mb-4 text-xs text-slate-400">Historial de bases procesadas.</p>
              {registros.length === 0 ? <div className="rounded-xl border border-slate-100 bg-slate-50/60 py-10 text-center text-xs text-slate-300">Aún no hay cargas registradas.</div> : (
                <div className="space-y-2">
                  {registros.map((r) => (
                    <div key={r.id} className="rounded-xl border border-slate-100 bg-slate-50/60 p-3">
                      <div className="flex items-center justify-between gap-2">
                        <span className="truncate text-sm font-medium text-slate-700">{r.archivo}</span>
                        <span className="tnum flex-shrink-0 text-[11px] text-slate-400">{fmtDate((r.fecha || "").slice(0, 10))}</span>
                      </div>
                      <p className="tnum mt-1 text-[11px] text-slate-500">{r.importados} importados · {r.duplicados} duplicados · {r.descartados} descartados (de {r.total})</p>
                      {r.driveLink && <a href={r.driveLink} target="_blank" rel="noopener noreferrer" className="mt-1 inline-flex items-center gap-1 text-[11px] font-medium text-[#1B3A6B] hover:underline"><Icon n="download" s={11} /> Ver en Drive</a>}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {/* PASO 2: mapeo de columnas + link drive */}
        {paso === "mapeo" && (
          <div className="space-y-4">
            <div className="rounded-2xl border border-slate-200 bg-white p-5">
              <div className="mb-3 flex items-center gap-2"><Icon n="list" s={15} style={{ color: BRAND.teal }} /><h3 className="text-sm font-semibold text-slate-700">Confirma las columnas</h3><span className="ml-auto text-xs text-slate-400">{fileName} · {rows.length} filas</span></div>
              <p className="mb-4 text-xs text-slate-400">Detecté automáticamente lo que pude. Ajusta si algo no coincide. Solo "Nombre" es obligatorio.</p>
              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                {[["nombre","Nombre del negocio *"],["telefono","Teléfono"],["correo","Correo"],["giro","Giro / actividad"],["empleados","Personal ocupado"],["municipio","Municipio"]].map(([campo, label]) => (
                  <Field key={campo} label={label}>
                    <select className={inputCls} value={mapeo[campo]} onChange={(e) => setMapeo((m) => ({ ...m, [campo]: e.target.value }))}>
                      <option value="">— Ninguna —</option>
                      {headers.map((h) => <option key={h} value={h}>{h}</option>)}
                    </select>
                  </Field>
                ))}
              </div>
            </div>
            <div className="rounded-2xl border border-slate-200 bg-white p-5">
              <Field label="Link del archivo en Google Drive * (queda como referencia del lote)">
                <input className={inputCls} value={driveLink} onChange={(e) => setDriveLink(e.target.value)} placeholder="https://drive.google.com/..." />
              </Field>
            </div>
            <div className="flex justify-end">
              <button onClick={irARevision} className="flex items-center gap-1.5 rounded-lg px-4 py-2 text-sm font-medium text-white bg-[#1B3A6B] hover:bg-[#132a4d]">Filtrar y revisar <Icon n="arrowR" s={14} /></button>
            </div>
          </div>
        )}

        {/* PASO 3: revisión */}
        {paso === "revision" && procesado && (
          <div className="space-y-4">
            {/* Controles de criterio (reprocesa en vivo) */}
            <div className="rounded-2xl border border-slate-200 bg-white p-5">
              <h3 className="mb-3 text-sm font-semibold text-slate-700">Criterios de filtrado</h3>
              <div className="flex flex-wrap items-end gap-4">
                <Field label="Empleados mín."><input type="number" className={inputCls + " w-24"} value={empMin} onChange={(e) => setEmpMin(Number(e.target.value) || 0)} /></Field>
                <Field label="Empleados máx."><input type="number" className={inputCls + " w-24"} value={empMax} onChange={(e) => setEmpMax(Number(e.target.value) || 0)} /></Field>
                <button onClick={reprocesar} className="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">Aplicar criterios</button>
              </div>
              {girosUnicos.length > 0 && (
                <div className="mt-4">
                  <p className="mb-2 text-xs font-medium text-slate-500">Giros a aceptar ({girosUnicos.length} detectados · desmarca los que no apliquen):</p>
                  <div className="max-h-44 space-y-1 overflow-y-auto rounded-lg border border-slate-100 bg-slate-50/50 p-2">
                    {girosUnicos.map((g) => (
                      <label key={g.giro} className="flex cursor-pointer items-center gap-2 rounded px-2 py-1 text-xs hover:bg-white">
                        <input type="checkbox" className="h-3.5 w-3.5 accent-[#1B3A6B]" checked={girosSel[g.giro] !== false} onChange={(e) => setGirosSel((s) => ({ ...s, [g.giro]: e.target.checked }))} />
                        <span className="flex-1 text-slate-700">{g.giro}</span>
                        <span className="tnum text-slate-400">{g.n}</span>
                      </label>
                    ))}
                  </div>
                  <button onClick={reprocesar} className="mt-2 text-xs font-medium text-[#1B3A6B] hover:underline">Recalcular con estos giros</button>
                </div>
              )}
            </div>

            {/* Resumen */}
            <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
              {[["Pasan automático", procesado.auto.length, BRAND.teal],["A revisión", procesado.revision.length, BRAND.orange],["Descartados", procesado.descartados.length, "#64748b"],["Duplicados ignorados", procesado.duplicados, "#94a3b8"]].map(([l, v, c]) => (
                <div key={l} className="rounded-xl border border-slate-200 bg-white p-3">
                  <p className="tnum text-2xl font-bold tracking-tight" style={{ color: c }}>{v}</p>
                  <p className="text-[11px] text-slate-500">{l}</p>
                </div>
              ))}
            </div>

            {/* Zona de revisión: el usuario marca cuáles aprobar */}
            {procesado.revision.length > 0 && (
              <div className="rounded-2xl border border-slate-200 bg-white p-5">
                <div className="mb-3 flex items-center justify-between">
                  <h3 className="text-sm font-semibold text-slate-700">Zona de revisión · decide cuáles incluir</h3>
                  <div className="flex gap-2">
                    <button onClick={() => { const rs = {}; procesado.revision.forEach((_, i) => rs[i] = true); setRevSel(rs); }} className="text-xs font-medium text-[#1B3A6B] hover:underline">Marcar todos</button>
                    <button onClick={() => setRevSel({})} className="text-xs font-medium text-slate-400 hover:underline">Ninguno</button>
                  </div>
                </div>
                <div className="max-h-72 space-y-1 overflow-y-auto">
                  {procesado.revision.map((l, i) => (
                    <label key={i} className="flex cursor-pointer items-center gap-3 rounded-lg border border-slate-100 px-3 py-2 text-sm hover:bg-slate-50">
                      <input type="checkbox" className="h-4 w-4 accent-[#1B3A6B]" checked={!!revSel[i]} onChange={(e) => setRevSel((s) => ({ ...s, [i]: e.target.checked }))} />
                      <div className="min-w-0 flex-1">
                        <p className="truncate font-medium text-slate-700">{l.nombre}</p>
                        <p className="truncate text-xs text-slate-400">{[l.telefono, l.correo, l.giro].filter(Boolean).join(" · ")}</p>
                      </div>
                      <span className="flex-shrink-0 rounded-full bg-orange-50 px-2 py-0.5 text-[10px] font-medium text-orange-600">{l.motivo}</span>
                    </label>
                  ))}
                </div>
              </div>
            )}

            {/* Preview de los que pasan automático */}
            {procesado.auto.length > 0 && (
              <details className="rounded-2xl border border-slate-200 bg-white p-5">
                <summary className="cursor-pointer text-sm font-semibold text-slate-700">Ver {procesado.auto.length} que pasan automático</summary>
                <div className="mt-3 max-h-60 space-y-1 overflow-y-auto">
                  {procesado.auto.map((l, i) => (
                    <div key={i} className="flex items-center gap-3 rounded-lg border border-slate-100 px-3 py-2 text-sm">
                      <Icon n="circleCheck" s={15} className="flex-shrink-0 text-[#1B3A6B]" />
                      <div className="min-w-0 flex-1"><p className="truncate font-medium text-slate-700">{l.nombre}</p><p className="truncate text-xs text-slate-400">{[l.telefono, l.correo, l.giro].filter(Boolean).join(" · ")}</p></div>
                    </div>
                  ))}
                </div>
              </details>
            )}

            {/* Confirmar */}
            <div className="flex items-center justify-between rounded-2xl border border-[#1B3A6B]/25 bg-[#1B3A6B]/5 p-4">
              <p className="text-sm text-slate-600">Se importarán <span className="font-bold text-slate-800">{procesado.auto.length + procesado.revision.filter((_, i) => revSel[i]).length}</span> leads (automáticos + los que marcaste).</p>
              <button onClick={confirmarImport} className="flex items-center gap-1.5 rounded-lg px-4 py-2 text-sm font-medium text-white bg-[#1B3A6B] hover:bg-[#132a4d]"><Icon n="check" s={15} /> Importar a Leads</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  function TaskAlert({ title, tasks, tone }) {
    const c = tone === "red" ? { ic: "#ef4444", bg: "#fef2f2" } : { ic: "#f59e0b", bg: "#fffbeb" };
    return (
      <div className="rounded-2xl border border-slate-200 bg-white p-5">
        <div className="mb-3 flex items-center gap-2">
          <div className="flex h-6 w-6 items-center justify-center rounded-lg" style={{ backgroundColor: c.bg }}><Icon n={tone === "red" ? "alert" : "clock"} s={13} style={{ color: c.ic }} /></div>
          <h3 className="text-sm font-semibold text-slate-700">{title}</h3>
          <span className="tnum ml-auto rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-500">{tasks.length}</span>
        </div>
        {tasks.length === 0 ? <p className="py-4 text-center text-xs text-slate-300">Nada por aquí. Bien.</p> : (
          <ul className="space-y-2">{tasks.slice(0, 5).map((t) => (
            <li key={t.id} className="flex items-center gap-2 text-sm"><span className="h-1.5 w-1.5 rounded-full" style={{ backgroundColor: c.ic }} /><span className="text-slate-700">{t.titulo}</span>{t.vinculo && <span className="text-xs text-slate-400">· {t.vinculo}</span>}</li>
          ))}</ul>
        )}
      </div>
    );
  }

  /* ----------------------------------------------------------------- */
  /*  Pipeline (kanban drag & drop)                                    */
  /* ----------------------------------------------------------------- */
  function Pipeline({ data, upsert, remove, logMove }) {
    const [editing, setEditing] = useState(null);
    const [vista, setVista] = useState("kanban");   // "kanban" | "lista"
    const [filtroEtapa, setFiltroEtapa] = useState("todas");
    const [accion, setAccion] = useState(null);     // { opp, tipo, destino, titulo }

    const exportCSV = () => {
      const headers = ["Nombre", "Empresa", "Contacto", "Tipo", "Origen", "Valor", "Etapa", "Inicio", "Cierre estimado", "Responsable", "Cierres previos", "Notas"];
      const rows = data.opportunities.map((o) => [o.nombre, o.empresa, o.contacto, typeOf(o.tipo).label, (originOf(o.origen) || {}).label || "", o.valor, stageOf(o.etapa).label, o.inicio || "", o.cierreAbierto ? "Abierta" : o.cierre, o.responsable, o.cierresPrevios || 0, (o.notas || "").replace(/\n/g, " ")]);
      const csv = [headers, ...rows].map((r) => r.map((c) => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"').join(",")).join("\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tablero_" + todayISO() + ".csv"; a.click();
    };
    const empty = { id: null, nombre: "", empresa: "", contacto: "", tipo: "privada", origen: "", valor: "", etapa: "prospecto", inicio: todayISO(), cierre: todayISO(), cierreAbierto: false, responsable: "", notas: "", acuerdos: "", pendientes: "", cierresPrevios: 0 };

    // Ejecuta una transición confirmada (avance, perdida o ganada).
    const ejecutar = (opp, tipo, destino, comentario, montoFinal) => {
      const from = opp.etapa;
      if (tipo === "ganada") {
        // Registrar cierre: guarda evento ganada, regresa a Prospecto, suma cierre previo, limpia valor/cotización.
        logMove({ ...opp, valor: montoFinal != null ? montoFinal : opp.valor }, from, "cierre", "ganada", comentario);
        upsert("opportunities", { ...opp, etapa: "prospecto", valor: 0, cierre: todayISO(), cierreAbierto: false, inicio: todayISO(), cierresPrevios: (opp.cierresPrevios || 0) + 1, ultimoCierre: { monto: montoFinal != null ? montoFinal : opp.valor, fecha: todayISO() } });
      } else if (tipo === "perdida") {
        logMove(opp, from, "prospecto", "perdida", comentario);
        upsert("opportunities", { ...opp, etapa: "prospecto" });
      } else {
        logMove(opp, from, destino, "avance", comentario);
        upsert("opportunities", { ...opp, etapa: destino });
      }
      setAccion(null);
    };

    const stageColumns = STAGES;
    const visibles = filtroEtapa === "todas" ? data.opportunities : data.opportunities.filter((o) => o.etapa === filtroEtapa);

    return (
      <div className="space-y-4">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-2">
            <div className="flex rounded-lg border border-slate-200 bg-white p-0.5">
              <button onClick={() => setVista("kanban")} className={"flex items-center gap-1.5 rounded-md px-2.5 py-1 text-xs font-medium transition-colors " + (vista === "kanban" ? "bg-slate-100 text-slate-800" : "text-slate-400 hover:text-slate-600")}><Icon n="grid" s={13} /> Kanban</button>
              <button onClick={() => setVista("lista")} className={"flex items-center gap-1.5 rounded-md px-2.5 py-1 text-xs font-medium transition-colors " + (vista === "lista" ? "bg-slate-100 text-slate-800" : "text-slate-400 hover:text-slate-600")}><Icon n="list" s={13} /> Lista</button>
            </div>
            {vista === "lista" && (
              <select value={filtroEtapa} onChange={(e) => setFiltroEtapa(e.target.value)} className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-medium text-slate-600 outline-none">
                <option value="todas">Todas las etapas</option>
                {STAGES.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            )}
            <span className="text-sm text-slate-400"><span className="tnum font-semibold text-slate-600">{data.opportunities.length}</span> tarjetas</span>
          </div>
          <div className="flex gap-2">
            <button onClick={exportCSV} className="flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-50"><Icon n="download" s={14} /> CSV</button>
            <button onClick={() => setEditing(empty)} className="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium text-white bg-[#1B3A6B] hover:bg-[#132a4d]"><Icon n="plus" s={14} /> Tarjeta</button>
          </div>
        </div>

        {vista === "kanban" ? (
          <div className="flex gap-3 overflow-x-auto pb-3">
            {stageColumns.map((stage) => {
              const items = data.opportunities.filter((o) => o.etapa === stage.id);
              const total = items.reduce((s, o) => s + (o.valor || 0), 0);
              return (
                <div key={stage.id} className="flex w-72 flex-shrink-0 flex-col rounded-xl border border-slate-200 bg-slate-100/60 p-2">
                  <div className="mb-1 flex items-center gap-2 px-1.5 pt-1">
                    <span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: stage.color }} />
                    <span className="text-xs font-semibold text-slate-700">{stage.label}</span>
                    <span className="tnum ml-auto rounded-full bg-white px-1.5 py-0.5 text-[10px] font-medium text-slate-400">{items.length}</span>
                  </div>
                  {stage.peso > 0 && <p className="tnum mb-2 px-1.5 text-[11px] font-medium text-slate-400">{fmtMXN(total)}</p>}
                  <div className="flex flex-col gap-2">
                    {items.map((o) => <Card key={o.id} o={o} onOpen={() => setEditing(o)} onAccion={setAccion} />)}
                    {items.length === 0 && <div className="rounded-lg border border-dashed border-slate-200 py-3 text-center text-[11px] text-slate-300">Vacío</div>}
                  </div>
                </div>
              );
            })}
          </div>
        ) : (
          <div className="space-y-2">
            {visibles.length === 0 ? <div className="rounded-2xl border border-dashed border-slate-200 py-16 text-center text-sm text-slate-400">Sin tarjetas en esta vista.</div> :
              visibles.sort((a, b) => stageIdx(b.etapa) - stageIdx(a.etapa)).map((o) => {
                const t = typeOf(o.tipo), s = stageOf(o.etapa);
                return (
                  <div key={o.id} className="flex items-center gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3">
                    <span className="h-2.5 w-2.5 flex-shrink-0 rounded-full" style={{ backgroundColor: s.color }} title={s.label} />
                    <div className="min-w-0 flex-1 cursor-pointer" onClick={() => setEditing(o)}>
                      <div className="flex items-center gap-2"><p className="truncate text-sm font-medium text-slate-800">{o.nombre}</p>{(o.cierresPrevios > 0) && <span className="flex-shrink-0 rounded-full bg-[#1B3A6B]/10 px-1.5 py-0.5 text-[10px] font-medium text-[#1B3A6B]">Cliente · {o.cierresPrevios}</span>}</div>
                      <p className="truncate text-xs text-slate-500">{o.empresa}{o.responsable ? " · " + o.responsable : ""}</p>
                    </div>
                    <span className="hidden sm:block"><Badge color={t.color} bg={t.bg}>{t.label.split(" ")[0]}</Badge></span>
                    <span className="tnum w-28 flex-shrink-0 text-right text-sm font-semibold text-slate-700">{s.peso > 0 ? fmtMXN(o.valor) : "—"}</span>
                    <span className="w-24 flex-shrink-0 text-right text-xs font-medium" style={{ color: s.color }}>{s.label}</span>
                  </div>
                );
              })}
          </div>
        )}

        {editing && <OppModal
          opp={editing}
          contacts={data.contacts}
          tasks={data.tasks}
          onClose={() => setEditing(null)}
          onSaveTask={(t) => upsert("tasks", t)}
          onDeleteTask={(id) => remove("tasks", id)}
          onSave={(o, plantilla, nuevoContacto) => {
            upsert("opportunities", o);
            if (nuevoContacto) upsert("contacts", nuevoContacto);
            if (plantilla) {
              const base = o.inicio || todayISO();
              PLANTILLA_SEGUIMIENTO.forEach((p) => {
                const d = new Date(base + "T00:00:00"); d.setDate(d.getDate() + p.dias);
                upsert("tasks", { id: uid(), titulo: p.titulo, vinculo: o.empresa || o.nombre, oppId: o.id, fecha: d.toISOString().slice(0, 10), hecha: false, responsable: o.responsable || "", prioridad: p.prioridad });
              });
            }
            setEditing(null);
          }}
          onDelete={(id) => { remove("opportunities", id); setEditing(null); }} />}

        {accion && <AccionModal accion={accion} onClose={() => setAccion(null)} onConfirm={ejecutar} />}
      </div>
    );
  }

  // Tarjeta del kanban con sus botones de acción-llave.
  function Card({ o, onOpen, onAccion }) {
    const t = typeOf(o.tipo), s = stageOf(o.etapa);
    const idx = stageIdx(o.etapa);
    return (
      <div className="group rounded-lg border border-slate-200 bg-white p-2.5 shadow-sm transition-all hover:shadow-md">
        <div className="cursor-pointer" onClick={onOpen}>
          <div className="flex items-start justify-between gap-1">
            <p className="flex-1 text-sm font-medium leading-tight text-slate-800">{o.nombre}</p>
            {(o.cierresPrevios > 0) && <span className="flex-shrink-0 rounded-full bg-[#1B3A6B]/10 px-1.5 py-0.5 text-[9px] font-semibold text-[#1B3A6B]" title={"Cliente con " + o.cierresPrevios + " cierre(s) previo(s)"}>★{o.cierresPrevios}</span>}
          </div>
          <p className="mt-1 text-xs text-slate-500">{o.empresa}</p>
          <div className="mt-2 flex items-center justify-between">
            <span className="tnum text-xs font-semibold text-slate-700">{s.peso > 0 ? fmtMXN(o.valor) : "—"}</span>
            <Badge color={t.color} bg={t.bg}>{t.label.split(" ")[0]}</Badge>
          </div>
        </div>
        {/* Acciones-llave */}
        <div className="mt-2 flex flex-wrap gap-1 border-t border-slate-100 pt-2">
          {s.accion && (
            <button onClick={() => onAccion({ opp: o, tipo: s.id === "negociacion" ? "ganada" : "avance", destino: s.siguiente, titulo: s.accion })}
              className="flex flex-1 items-center justify-center gap-1 rounded-md px-2 py-1 text-[11px] font-semibold text-white" style={{ backgroundColor: s.color }}>
              <Icon n={s.id === "negociacion" ? "award" : "arrowR"} s={12} /> {s.accion}
            </button>
          )}
          {idx >= stageIdx("oportunidad") && o.etapa !== "cierre" && (
            <button onClick={() => onAccion({ opp: o, tipo: "perdida", destino: "prospecto", titulo: "Regresar a Prospecto" })}
              className="flex items-center justify-center gap-1 rounded-md border border-slate-200 px-2 py-1 text-[11px] font-medium text-slate-500 hover:bg-slate-50" title="No avanzó: regresa a Prospecto">
              <Icon n="arrowD" s={12} />
            </button>
          )}
        </div>
      </div>
    );
  }

  // Modal de confirmación de acción-llave (avance / perdida / ganada) con comentario opcional.
  function AccionModal({ accion, onClose, onConfirm }) {
    const { opp, tipo, destino, titulo } = accion;
    const [comentario, setComentario] = useState("");
    const [monto, setMonto] = useState(opp.valor || "");
    const esGanada = tipo === "ganada";
    const esPerdida = tipo === "perdida";
    const desc = esGanada
      ? "Registra el cierre como ganado. La tarjeta regresará a Prospecto (puede recomprar) y quedará marcada como cliente."
      : esPerdida
      ? "La oportunidad no avanzó. Regresa a Prospecto para reactivarla después. Queda registrada como caída."
      : "Confirma que ya realizaste esta acción para avanzar a la siguiente etapa.";
    return (
      <Modal title={titulo} onClose={onClose}>
        <div className="space-y-3">
          <p className="text-sm text-slate-500">{desc}</p>
          {esGanada && (
            <Field label="Monto final del cierre (MXN)"><input type="number" className={inputCls} value={monto} onChange={(e) => setMonto(e.target.value)} placeholder="0" autoFocus /></Field>
          )}
          <Field label="Comentario (opcional)"><textarea rows={2} className={inputCls} value={comentario} onChange={(e) => setComentario(e.target.value)} placeholder="Notas de esta acción…" /></Field>
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={onClose} className="rounded-lg px-4 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100">Cancelar</button>
            <button onClick={() => onConfirm(opp, tipo, destino, comentario, esGanada ? (Number(monto) || 0) : undefined)}
              className="rounded-lg px-4 py-2 text-sm font-medium text-white" style={{ backgroundColor: esPerdida ? "#64748b" : esGanada ? "#10b981" : BRAND.teal }}>
              {esGanada ? "Registrar cierre" : esPerdida ? "Regresar a Prospecto" : "Confirmar y avanzar"}
            </button>
          </div>
        </div>
      </Modal>
    );
  }

  function OppModal({ opp, contacts = [], tasks = [], onClose, onSave, onSaveTask, onDeleteTask, onDelete }) {
    const [f, setF] = useState({ inicio: todayISO(), cierre: todayISO(), cierreAbierto: false, acuerdos: "", pendientes: "", cierresPrevios: 0, ...opp });
    const [aplicarPlantilla, setAplicarPlantilla] = useState(false);
    const [nuevaTarea, setNuevaTarea] = useState({ titulo: "", fecha: todayISO(), prioridad: "media" });
    // Datos de contacto para autoguardar en Leads (solo al crear).
    const [tel, setTel] = useState("");
    const [mail, setMail] = useState("");
    const oppId = opp.id;
    const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
    const onContacto = (v) => {
      setF((p) => {
        const match = contacts.find((c) => (c.nombre || "").toLowerCase() === v.toLowerCase());
        if (match) { setTel(match.telefono || ""); setMail(match.email || ""); return { ...p, contacto: v, empresa: match.empresa || p.empresa, tipo: match.tipo || p.tipo }; }
        return { ...p, contacto: v };
      });
    };
    const save = () => {
      if (!f.nombre.trim()) return;
      const oid = f.id || uid();
      const clean = { ...f, id: oid, valor: Number(f.valor) || 0, cierresPrevios: f.cierresPrevios || 0 };
      // ¿Autoguardar contacto nuevo en Leads? Solo si hay nombre de contacto y no existe ya (por nombre o correo).
      let nuevoContacto = null;
      if (f.contacto && f.contacto.trim()) {
        const existe = contacts.find((c) => (c.nombre || "").toLowerCase() === f.contacto.toLowerCase() || (mail && (c.email || "").toLowerCase() === mail.toLowerCase()));
        if (!existe) nuevoContacto = { id: uid(), nombre: f.contacto.trim(), empresa: f.empresa || "", puesto: "", email: mail || "", telefono: tel || "", tipo: f.tipo || "privada", notas: "" };
      }
      onSave(clean, aplicarPlantilla, nuevoContacto);
    };
    const seguimientos = tasks.filter((t) => t.oppId && t.oppId === oppId).sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
    const agregarSeguimiento = () => {
      if (!nuevaTarea.titulo.trim()) return;
      onSaveTask({ id: uid(), titulo: nuevaTarea.titulo, vinculo: f.empresa || f.nombre, oppId, fecha: nuevaTarea.fecha, hecha: false, responsable: f.responsable || "", prioridad: nuevaTarea.prioridad });
      setNuevaTarea({ titulo: "", fecha: todayISO(), prioridad: "media" });
    };
    return (
      <Modal title={opp.id ? "Editar tarjeta" : "Nueva tarjeta"} onClose={onClose}>
        <div className="space-y-3">
          {opp.id && f.cierresPrevios > 0 && (
            <div className="flex items-center gap-2 rounded-lg bg-[#1B3A6B]/8 px-3 py-2 text-xs font-medium text-[#1B3A6B]"><Icon n="award" s={14} /> Cliente recurrente · {f.cierresPrevios} cierre(s) previo(s){f.ultimoCierre ? " · último " + fmtMXN(f.ultimoCierre.monto) : ""}</div>
          )}
          <Field label="Nombre del proyecto *"><input className={inputCls} value={f.nombre} onChange={(e) => set("nombre", e.target.value)} placeholder="Ej. Reacondicionamiento piso 4" autoFocus /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Empresa"><input className={inputCls} value={f.empresa} onChange={(e) => set("empresa", e.target.value)} /></Field>
            <Field label="Contacto">
              <input className={inputCls} value={f.contacto} onChange={(e) => onContacto(e.target.value)} list="contactos-existentes" placeholder="Escribe o elige…" autoComplete="off" />
              <datalist id="contactos-existentes">
                {contacts.map((c) => <option key={c.id} value={c.nombre}>{c.empresa ? c.empresa : ""}</option>)}
              </datalist>
            </Field>
          </div>
          {!opp.id && (
            <div className="grid grid-cols-2 gap-3">
              <Field label="Teléfono del contacto"><input className={inputCls} value={tel} onChange={(e) => setTel(e.target.value)} placeholder="Se guardará en Leads" /></Field>
              <Field label="Correo del contacto"><input className={inputCls} value={mail} onChange={(e) => setMail(e.target.value)} placeholder="Se guardará en Leads" /></Field>
            </div>
          )}
          <div className="grid grid-cols-2 gap-3">
            <Field label="Tipo de cliente"><select className={inputCls} value={f.tipo} onChange={(e) => set("tipo", e.target.value)}>{CLIENT_TYPES.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select></Field>
            <Field label="Valor estimado (MXN)"><input type="number" className={inputCls} value={f.valor} onChange={(e) => set("valor", e.target.value)} placeholder="0" /></Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Etapa"><select className={inputCls} value={f.etapa} onChange={(e) => set("etapa", e.target.value)}>{STAGES.map((s) => <option key={s.id} value={s.id}>{s.label}{s.peso > 0 ? " · " + s.peso + "%" : ""}</option>)}</select></Field>
            <Field label="Responsable"><input className={inputCls} value={f.responsable} onChange={(e) => set("responsable", e.target.value)} placeholder="Quién lleva la cuenta" /></Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Fecha de inicio"><input type="date" className={inputCls} value={f.inicio || ""} onChange={(e) => set("inicio", e.target.value)} /></Field>
            <Field label="Cierre estimado">
              <input type="date" className={inputCls + (f.cierreAbierto ? " opacity-40 pointer-events-none" : "")} value={f.cierre || ""} onChange={(e) => set("cierre", e.target.value)} />
              <label className="mt-1 flex cursor-pointer items-center gap-1.5 text-xs text-slate-500"><input type="checkbox" className="h-3.5 w-3.5 accent-[#1B3A6B]" checked={!!f.cierreAbierto} onChange={(e) => set("cierreAbierto", e.target.checked)} /> Sin fecha de cierre / relación abierta</label>
            </Field>
          </div>
          <Field label="Origen del lead"><select className={inputCls} value={f.origen || ""} onChange={(e) => set("origen", e.target.value)}><option value="">— Sin especificar —</option>{ORIGINS.map((o) => <option key={o.id} value={o.id}>{o.label}</option>)}</select></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Acuerdos / Compromisos"><textarea rows={2} className={inputCls} value={f.acuerdos || ""} onChange={(e) => set("acuerdos", e.target.value)} /></Field>
            <Field label="Pendientes"><textarea rows={2} className={inputCls} value={f.pendientes || ""} onChange={(e) => set("pendientes", e.target.value)} /></Field>
          </div>
          <Field label="Notas"><textarea rows={2} className={inputCls} value={f.notas || ""} onChange={(e) => set("notas", e.target.value)} /></Field>

          {!opp.id && (
            <label className="flex cursor-pointer items-start gap-2 rounded-lg border border-[#1B3A6B]/25 bg-[#1B3A6B]/5 p-3">
              <input type="checkbox" className="mt-0.5 h-4 w-4 accent-[#1B3A6B]" checked={aplicarPlantilla} onChange={(e) => setAplicarPlantilla(e.target.checked)} />
              <span className="text-sm text-slate-700">
                <span className="font-medium">Aplicar plantilla de seguimiento</span>
                <span className="block text-xs text-slate-500">Genera {PLANTILLA_SEGUIMIENTO.length} recordatorios automáticos (días {PLANTILLA_SEGUIMIENTO.map((p) => p.dias).join(", ")} desde la fecha de inicio) en Tareas y Calendario. Si la fecha de inicio es previa, los recordatorios vencidos se crean igual.</span>
              </span>
            </label>
          )}

          {opp.id && (
            <div className="rounded-lg border border-slate-200 bg-slate-50/60 p-3">
              <div className="mb-2 flex items-center gap-2">
                <Icon n="check" s={14} className="text-slate-500" />
                <span className="text-sm font-semibold text-slate-700">Trayecto de seguimiento</span>
                <span className="tnum ml-auto rounded-full bg-white px-1.5 py-0.5 text-[10px] font-medium text-slate-400">{seguimientos.length}</span>
              </div>
              {seguimientos.length > 0 && (
                <ul className="mb-2 space-y-1">
                  {seguimientos.map((t) => {
                    const p = PRIORITIES.find((x) => x.id === t.prioridad) || PRIORITIES[1];
                    const vencida = !t.hecha && t.fecha < todayISO();
                    return (
                      <li key={t.id} className="flex items-center gap-2 rounded-md bg-white px-2 py-1.5 text-xs">
                        <button onClick={() => onSaveTask({ ...t, hecha: !t.hecha })} className="flex-shrink-0">{t.hecha ? <Icon n="circleCheck" s={15} className="text-[#1B3A6B]" /> : <Icon n="circle" s={15} className="text-slate-300 hover:text-[#1B3A6B]" />}</button>
                        <span className={"flex-1 " + (t.hecha ? "text-slate-400 line-through" : "text-slate-700")}>{t.titulo}</span>
                        <span className={vencida ? "font-semibold text-red-500" : "text-slate-400"}>{fmtDate(t.fecha)}</span>
                        <span className="h-1.5 w-1.5 flex-shrink-0 rounded-full" style={{ backgroundColor: p.color }} />
                        <button onClick={() => onDeleteTask(t.id)} className="flex-shrink-0 text-slate-300 hover:text-red-500"><Icon n="trash" s={12} /></button>
                      </li>
                    );
                  })}
                </ul>
              )}
              <div className="flex items-end gap-2">
                <div className="flex-1"><input className={inputCls + " text-sm"} value={nuevaTarea.titulo} onChange={(e) => setNuevaTarea((p) => ({ ...p, titulo: e.target.value }))} placeholder="Agregar seguimiento suelto…" onKeyDown={(e) => e.key === "Enter" && agregarSeguimiento()} /></div>
                <input type="date" className={inputCls + " w-36 text-sm"} value={nuevaTarea.fecha} onChange={(e) => setNuevaTarea((p) => ({ ...p, fecha: e.target.value }))} />
                <button onClick={agregarSeguimiento} className="flex-shrink-0 rounded-lg bg-slate-700 px-3 py-2 text-sm font-medium text-white hover:bg-slate-800"><Icon n="plus" s={14} /></button>
              </div>
            </div>
          )}

          <div className="flex items-center justify-between pt-1">
            {opp.id ? <button onClick={() => onDelete(opp.id)} className="flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50"><Icon n="trash" s={14} /> Eliminar</button> : <span />}
            <div className="flex gap-2">
              <button onClick={onClose} className="rounded-lg px-4 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100">Cancelar</button>
              <button onClick={save} className="rounded-lg bg-[#1B3A6B] px-4 py-2 text-sm font-medium text-white hover:bg-[#132a4d]">Guardar</button>
            </div>
          </div>
        </div>
      </Modal>
    );
  }

  /* ----------------------------------------------------------------- */
  /*  Contactos                                                        */
  /* ----------------------------------------------------------------- */
  function Contacts({ data, upsert, remove, search, setSearch }) {
    const [editing, setEditing] = useState(null);
    const [verPapelera, setVerPapelera] = useState(false);
    const [convertir, setConvertir] = useState(null); // lead a convertir en prospecto
    const empty = { id: null, empresa: "", nombre: "", puesto: "", email: "", telefono: "", tipo: "privada", giro: "", municipio: "", estado: "activo", notas: "", bitacora: [], prioritario: false };
    const esActivo = (c) => (c.estado || "activo") === "activo";
    // Un lead está "en seguimiento" si tiene al menos una interacción en bitácora, o una nota previa.
    const enSeguimiento = (c) => (c.bitacora && c.bitacora.length > 0) || (c.notas && c.notas.trim().length > 0);
    const base = data.contacts.filter((c) => verPapelera ? c.estado === "descartado" : esActivo(c));
    const q = search.toLowerCase();
    const filtered = base.filter((c) => ((c.nombre || "") + " " + (c.empresa || "") + " " + (c.email || "") + " " + (c.giro || "") + " " + (c.municipio || "")).toLowerCase().includes(q))
      // Orden alfabético por empresa (o nombre si no hay empresa).
      .sort((a, b) => (a.empresa || a.nombre || "").localeCompare(b.empresa || b.nombre || "", "es", { sensitivity: "base" }));
    const nActivos = data.contacts.filter(esActivo).length;
    const nPapelera = data.contacts.filter((c) => c.estado === "descartado").length;

    const descartar = (c) => upsert("contacts", { ...c, estado: "descartado", descartadoEn: new Date().toISOString() });
    const restaurar = (c) => upsert("contacts", { ...c, estado: "activo" });
    const togglePrioritario = (c) => upsert("contacts", { ...c, prioritario: !c.prioritario });

    // Convierte un Lead a Prospecto registrando la interacción clave de conversión.
    const hacerProspecto = (c, categoriaConversion, descripcionConversion) => {
      const oid = uid();
      const ahora = new Date().toISOString();
      // La conversión queda como última entrada en la bitácora del lead.
      const entryConversion = { id: uid(), fecha: ahora, categoria: categoriaConversion, descripcion: descripcionConversion || "Interacción de conversión a Prospecto", compromisos: "", conversion: true };
      const bitacora = [...(c.bitacora || []), entryConversion];
      upsert("opportunities", { id: oid, nombre: "Prospecto · " + (c.empresa || c.nombre), empresa: c.empresa || c.nombre || "", contacto: c.nombre || "", tipo: c.tipo || "privada", origen: "", valor: 0, etapa: "prospecto", inicio: todayISO(), cierre: todayISO(), cierreAbierto: false, responsable: "", notas: c.giro ? "Giro: " + c.giro : "", acuerdos: "", pendientes: "", cierresPrevios: 0 });
      upsert("movements", { id: uid(), oppId: oid, oppNombre: "Prospecto · " + (c.empresa || c.nombre), empresa: c.empresa || "", from: "lead", to: "prospecto", tipo: "avance", comentario: "Conversión vía " + categoriaConversion, categoria: categoriaConversion, monto: 0, fecha: ahora });
      upsert("contacts", { ...c, estado: "convertido", bitacora });
      setConvertir(null);
    };

    return (
      <div className="space-y-4">
        <div className="flex items-end justify-between">
          <div>
            <h2 className="text-xl font-bold tracking-tight text-slate-900">{verPapelera ? "Papelera de Leads" : "Leads"}</h2>
            <p className="mt-0.5 text-sm text-slate-500">{verPapelera ? "Leads descartados. Puedes restaurarlos." : "Registra interacciones; al agendar videollamada, pasa el lead a Prospecto."}</p>
          </div>
          <button onClick={() => { setVerPapelera(!verPapelera); }} className={"flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-sm font-medium " + (verPapelera ? "border-[#1B3A6B] text-[#1B3A6B]" : "border-slate-200 bg-white text-slate-500 hover:bg-slate-50")}>
            <Icon n="trash" s={14} /> {verPapelera ? "Volver a Leads" : "Papelera"}{nPapelera > 0 && <span className="tnum rounded-full bg-slate-100 px-1.5 text-[10px]">{nPapelera}</span>}
          </button>
        </div>
        {/* Leyenda de estados */}
        {!verPapelera && (
          <div className="flex flex-wrap items-center gap-4 text-[11px] text-slate-400">
            <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded border-2 border-slate-200" /> Sin contactar</span>
            <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded border-2" style={{ borderColor: BRAND.orange }} /> En seguimiento</span>
            <span className="flex items-center gap-1.5"><Icon n="flag" s={12} className="text-red-500" /> Prioritario</span>
          </div>
        )}
        <div className="flex items-center justify-between gap-3">
          <div className="relative max-w-xs flex-1">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon n="search" s={15} /></span>
            <input className={inputCls + " pl-9"} placeholder="Buscar lead…" value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
          <div className="flex items-center gap-3">
            {!verPapelera && <span className="text-sm text-slate-400"><span className="tnum font-semibold text-slate-600">{nActivos}</span> activos</span>}
            {!verPapelera && <button onClick={() => setEditing(empty)} className="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium text-white bg-[#1B3A6B] hover:bg-[#132a4d]"><Icon n="plus" s={14} /> Lead</button>}
          </div>
        </div>
        {filtered.length === 0 ? <div className="rounded-2xl border border-dashed border-slate-200 py-16 text-center text-sm text-slate-400">{verPapelera ? "La papelera está vacía." : "Sin leads todavía. Agrega el primero o impórtalos desde Base de Datos."}</div> : (
          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            {filtered.map((c) => {
              const t = typeOf(c.tipo);
              const seg = enSeguimiento(c);
              const nInter = (c.bitacora || []).length;
              return (
                <div key={c.id} className="group relative rounded-2xl border-2 bg-white p-4 transition-all hover:shadow-md" style={{ borderColor: verPapelera ? "#e2e8f0" : (seg ? BRAND.orange : "#e2e8f0") }}>
                  {!verPapelera && c.prioritario && <span className="absolute -right-1.5 -top-1.5 flex h-6 w-6 items-center justify-center rounded-full bg-red-500 text-white shadow" title="Prioritario"><Icon n="flag" s={12} /></span>}
                  <div className="flex cursor-pointer items-start justify-between" onClick={() => setEditing(c)}>
                    <div className="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold" style={{ backgroundColor: t.bg, color: t.color }}>{(c.nombre || "?").slice(0, 1).toUpperCase()}</div>
                    <Badge color={t.color} bg={t.bg}>{t.label.split(" ")[0]}</Badge>
                  </div>
                  <p className="mt-3 cursor-pointer text-sm font-semibold text-slate-800" onClick={() => setEditing(c)}>{c.empresa || c.nombre || "Sin nombre"}</p>
                  {c.nombre && c.empresa && <p className="text-xs text-slate-500">{c.nombre}</p>}
                  {c.giro && <p className="truncate text-xs text-slate-500" title={c.giro}>{c.giro}</p>}
                  {c.municipio && <p className="text-[11px] text-slate-400">{c.municipio}</p>}
                  <div className="mt-3 space-y-1 border-t border-slate-100 pt-3">
                    {c.email && <p className="flex items-center gap-1.5 text-xs text-slate-500"><Icon n="mail" s={12} /> {c.email}</p>}
                    {c.telefono && <p className="flex items-center gap-1.5 text-xs text-slate-500"><Icon n="phone" s={12} /> {c.telefono}</p>}
                    {seg && !verPapelera && <p className="tnum text-[11px] font-medium" style={{ color: BRAND.orange }}>{nInter > 0 ? nInter + " interacción(es)" : "Con notas"}</p>}
                  </div>
                  {verPapelera ? (
                    <button onClick={() => restaurar(c)} className="mt-3 flex w-full items-center justify-center gap-1.5 rounded-lg border border-[#1B3A6B]/30 bg-[#1B3A6B]/5 py-1.5 text-xs font-semibold text-[#1B3A6B] hover:bg-[#1B3A6B]/10"><Icon n="refresh" s={13} /> Restaurar</button>
                  ) : (
                    <div className="mt-3 space-y-2">
                      <div className="flex gap-2">
                        <button onClick={() => setEditing(c)} className="flex flex-1 items-center justify-center gap-1.5 rounded-lg border border-slate-200 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50"><Icon n="plus" s={13} /> Interacción</button>
                        <button onClick={() => togglePrioritario(c)} title={c.prioritario ? "Quitar prioritario" : "Marcar prioritario"} className={"flex items-center justify-center rounded-lg border px-2 py-1.5 " + (c.prioritario ? "border-red-300 bg-red-50 text-red-500" : "border-slate-200 text-slate-400 hover:bg-slate-50")}><Icon n="flag" s={13} /></button>
                        <button onClick={() => descartar(c)} title="Mover a papelera" className="flex items-center justify-center rounded-lg border border-slate-200 px-2 py-1.5 text-slate-400 hover:bg-slate-50 hover:text-red-500"><Icon n="trash" s={13} /></button>
                      </div>
                      <button onClick={() => setConvertir(c)} className="flex w-full items-center justify-center gap-1.5 rounded-lg py-1.5 text-xs font-semibold text-white bg-[#1B3A6B] hover:bg-[#132a4d]"><Icon n="arrowR" s={13} /> Pasar a Prospecto</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
        {editing && <ContactModal c={editing} onClose={() => setEditing(null)} onSave={(x) => { upsert("contacts", x); setEditing(null); }} onDelete={(id) => { remove("contacts", id); setEditing(null); }} />}
        {convertir && <ConvertirModal lead={convertir} onClose={() => setConvertir(null)} onConfirm={hacerProspecto} />}
      </div>
    );
  }

  // Modal de conversión: exige la categoría de la interacción clave que volvió prospecto al lead.
  function ConvertirModal({ lead, onClose, onConfirm }) {
    const [categoria, setCategoria] = useState("Llamada");
    const [descripcion, setDescripcion] = useState("");
    return (
      <Modal title="Pasar a Prospecto" onClose={onClose}>
        <div className="space-y-3">
          <p className="text-sm text-slate-500">Registra la <span className="font-medium text-slate-700">interacción clave</span> que convirtió a <span className="font-medium text-slate-700">{lead.empresa || lead.nombre}</span> en prospecto. Quedará como última entrada de su bitácora.</p>
          <Field label="Categoría de la interacción de conversión *">
            <select className={inputCls} value={categoria} onChange={(e) => setCategoria(e.target.value)}>
              {CATEGORIAS_CONTACTO.map((x) => <option key={x} value={x}>{x}</option>)}
            </select>
          </Field>
          <Field label="Descripción (opcional)"><textarea rows={2} className={inputCls} value={descripcion} onChange={(e) => setDescripcion(e.target.value)} placeholder="Ej. Aceptó videollamada para el jueves." /></Field>
          <div className="rounded-lg bg-[#1B3A6B]/5 px-3 py-2 text-xs text-slate-500">Al confirmar, se crea la tarjeta en el Tablero (etapa Prospecto) y se registra el movimiento Lead → Prospecto.</div>
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={onClose} className="rounded-lg px-4 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100">Cancelar</button>
            <button onClick={() => onConfirm(lead, categoria, descripcion)} className="rounded-lg px-4 py-2 text-sm font-medium text-white bg-[#1B3A6B] hover:bg-[#132a4d]">Confirmar conversión</button>
          </div>
        </div>
      </Modal>
    );
  }
  function ContactModal({ c, onClose, onSave, onDelete }) {
    const [f, setF] = useState({ bitacora: [], prioritario: false, ...c });
    const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
    // Formulario de nueva interacción para la bitácora.
    const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
    const [inter, setInter] = useState({ descripcion: "", categoria: "Llamada", compromisos: "", fecha: nowLocal() });
    const bitacora = (f.bitacora || []).slice().sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));

    const agregarInteraccion = () => {
      if (!inter.descripcion.trim()) return;
      const entry = { id: uid(), descripcion: inter.descripcion.trim(), categoria: inter.categoria, compromisos: inter.compromisos.trim(), fecha: new Date(inter.fecha).toISOString() };
      setF((p) => ({ ...p, bitacora: [...(p.bitacora || []), entry] }));
      setInter({ descripcion: "", categoria: "Llamada", compromisos: "", fecha: nowLocal() });
    };
    const borrarInteraccion = (id) => setF((p) => ({ ...p, bitacora: (p.bitacora || []).filter((e) => e.id !== id) }));

    return (
      <Modal title={c.id ? "Editar lead" : "Nuevo lead"} onClose={onClose}>
        <div className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Nombre del contacto"><input className={inputCls} value={f.nombre || ""} onChange={(e) => set("nombre", e.target.value)} autoFocus /></Field>
            <Field label="Puesto"><input className={inputCls} value={f.puesto || ""} onChange={(e) => set("puesto", e.target.value)} /></Field>
          </div>
          <Field label="Empresa *"><input className={inputCls} value={f.empresa || ""} onChange={(e) => set("empresa", e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Email"><input className={inputCls} value={f.email || ""} onChange={(e) => set("email", e.target.value)} /></Field>
            <Field label="Teléfono"><input className={inputCls} value={f.telefono || ""} onChange={(e) => set("telefono", e.target.value)} /></Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Giro / actividad"><input className={inputCls} value={f.giro || ""} onChange={(e) => set("giro", e.target.value)} /></Field>
            <Field label="Municipio"><input className={inputCls} value={f.municipio || ""} onChange={(e) => set("municipio", e.target.value)} /></Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Tipo de cliente"><select className={inputCls} value={f.tipo} onChange={(e) => set("tipo", e.target.value)}>{CLIENT_TYPES.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select></Field>
            <Field label="Prioridad">
              <label className="flex h-[38px] cursor-pointer items-center gap-2 rounded-lg border border-slate-200 px-3 text-sm text-slate-600"><input type="checkbox" className="h-4 w-4 accent-red-500" checked={!!f.prioritario} onChange={(e) => set("prioritario", e.target.checked)} /> <Icon n="flag" s={13} className={f.prioritario ? "text-red-500" : "text-slate-300"} /> Prioritario</label>
            </Field>
          </div>
          <Field label="Notas generales"><textarea rows={2} className={inputCls} value={f.notas || ""} onChange={(e) => set("notas", e.target.value)} placeholder="Contexto general del lead (sin fecha)." /></Field>

          {/* Bitácora de contacto */}
          <div className="rounded-xl border border-slate-200 bg-slate-50/60 p-3">
            <div className="mb-2 flex items-center gap-2">
              <Icon n="check" s={14} style={{ color: BRAND.orange }} />
              <span className="text-sm font-semibold text-slate-700">Bitácora de contacto</span>
              <span className="tnum ml-auto rounded-full bg-white px-1.5 py-0.5 text-[10px] font-medium text-slate-400">{bitacora.length}</span>
            </div>
            {/* Nueva interacción */}
            <div className="space-y-2 rounded-lg border border-slate-200 bg-white p-2.5">
              <div className="grid grid-cols-2 gap-2">
                <select className={inputCls + " text-sm"} value={inter.categoria} onChange={(e) => setInter((p) => ({ ...p, categoria: e.target.value }))}>
                  {CATEGORIAS_CONTACTO.map((x) => <option key={x} value={x}>{x}</option>)}
                </select>
                <input type="datetime-local" className={inputCls + " text-sm"} value={inter.fecha} onChange={(e) => setInter((p) => ({ ...p, fecha: e.target.value }))} />
              </div>
              <textarea rows={2} className={inputCls + " text-sm"} value={inter.descripcion} onChange={(e) => setInter((p) => ({ ...p, descripcion: e.target.value }))} placeholder="Descripción de la interacción (ej. le llamé y no lo encontré)" />
              <input className={inputCls + " text-sm"} value={inter.compromisos} onChange={(e) => setInter((p) => ({ ...p, compromisos: e.target.value }))} placeholder="Compromisos (ej. quedé en llamarle mañana)" />
              <button onClick={agregarInteraccion} className="flex w-full items-center justify-center gap-1.5 rounded-lg py-1.5 text-xs font-semibold text-white bg-[#1B3A6B] hover:bg-[#132a4d]"><Icon n="plus" s={13} /> Registrar interacción</button>
            </div>
            {/* Historial */}
            {bitacora.length > 0 && (
              <div className="mt-2 max-h-56 space-y-1.5 overflow-y-auto">
                {bitacora.map((e) => (
                  <div key={e.id} className={"rounded-lg border bg-white p-2.5 text-xs " + (e.conversion ? "border-[#1B3A6B]/40" : "border-slate-100")}>
                    <div className="flex items-center gap-2">
                      <span className="rounded-full px-1.5 py-0.5 text-[10px] font-semibold" style={{ backgroundColor: BRAND.navy + "15", color: BRAND.navy }}>{e.categoria}</span>
                      {e.conversion && <span className="rounded-full bg-[#1B3A6B]/10 px-1.5 py-0.5 text-[10px] font-semibold text-[#1B3A6B]">Conversión</span>}
                      <span className="tnum ml-auto text-[10px] text-slate-400">{fmtDateTime(e.fecha)}</span>
                      <button onClick={() => borrarInteraccion(e.id)} className="text-slate-300 hover:text-red-500"><Icon n="trash" s={11} /></button>
                    </div>
                    <p className="mt-1 text-slate-700">{e.descripcion}</p>
                    {e.compromisos && <p className="mt-0.5 text-slate-500"><span className="font-medium">Compromiso:</span> {e.compromisos}</p>}
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="flex items-center justify-between pt-1">
            {c.id ? <button onClick={() => onDelete(c.id)} className="flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50"><Icon n="trash" s={14} /> Eliminar</button> : <span />}
            <div className="flex gap-2">
              <button onClick={onClose} className="rounded-lg px-4 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100">Cancelar</button>
              <button onClick={() => (f.empresa || f.nombre || "").trim() && onSave({ ...f, id: f.id || uid(), estado: f.estado || "activo" })} className="rounded-lg bg-[#1B3A6B] px-4 py-2 text-sm font-medium text-white hover:bg-[#132a4d]">Guardar</button>
            </div>
          </div>
        </div>
      </Modal>
    );
  }

  /* ----------------------------------------------------------------- */
  /*  Tareas                                                           */
  /* ----------------------------------------------------------------- */
  function Tasks({ data, upsert, remove }) {
    const [editing, setEditing] = useState(null);
    const empty = { id: null, titulo: "", vinculo: "", fecha: todayISO(), hecha: false, responsable: "", prioridad: "media" };
    const toggle = (t) => upsert("tasks", { ...t, hecha: !t.hecha });
    const pendientes = data.tasks.filter((t) => !t.hecha).sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
    const hechas = data.tasks.filter((t) => t.hecha);
    const Row = ({ t }) => {
      const p = PRIORITIES.find((x) => x.id === t.prioridad) || PRIORITIES[1];
      const vencida = !t.hecha && t.fecha < todayISO();
      return (
        <div className="flex items-center gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3">
          <button onClick={() => toggle(t)} className="flex-shrink-0 text-slate-300 hover:text-[#1B3A6B]">{t.hecha ? <Icon n="circleCheck" s={20} className="text-[#1B3A6B]" /> : <Icon n="circle" s={20} />}</button>
          <div className="min-w-0 flex-1 cursor-pointer" onClick={() => setEditing(t)}>
            <p className={"text-sm font-medium " + (t.hecha ? "text-slate-400 line-through" : "text-slate-800")}>{t.titulo}</p>
            <div className="mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs text-slate-400">
              {t.vinculo && <span className="flex items-center gap-1"><Icon n="building" s={11} />{t.vinculo}</span>}
              {t.responsable && <span>· {t.responsable}</span>}
              <span className={"flex items-center gap-1 " + (vencida ? "font-semibold text-red-500" : "")}><Icon n="cal" s={11} />{fmtDate(t.fecha)}</span>
            </div>
          </div>
          {!t.hecha && <span className="h-2 w-2 flex-shrink-0 rounded-full" style={{ backgroundColor: p.color }} title={"Prioridad " + p.label} />}
          <button onClick={() => remove("tasks", t.id)} className="flex-shrink-0 text-slate-300 hover:text-red-500"><Icon n="trash" s={15} /></button>
        </div>
      );
    };
    return (
      <div className="space-y-4">
        <div className="flex items-center justify-between">
          <p className="text-sm text-slate-500"><span className="font-semibold text-slate-700">{pendientes.length}</span> pendientes · <span className="text-slate-400">{hechas.length} completadas</span></p>
          <button onClick={() => setEditing(empty)} className="flex items-center gap-1.5 rounded-lg bg-[#1B3A6B] px-3 py-1.5 text-sm font-medium text-white hover:bg-[#132a4d]"><Icon n="plus" s={14} /> Tarea</button>
        </div>
        {pendientes.length === 0 && hechas.length === 0 ? <div className="rounded-2xl border border-dashed border-slate-200 py-16 text-center text-sm text-slate-400">Sin tareas. Agrega un seguimiento.</div> : (
          <div className="space-y-2">
            {pendientes.map((t) => <Row key={t.id} t={t} />)}
            {hechas.length > 0 && <p className="px-1 pt-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Completadas</p>}
            {hechas.map((t) => <Row key={t.id} t={t} />)}
          </div>
        )}
        {editing && <TaskModal t={editing} onClose={() => setEditing(null)} onSave={(x) => { upsert("tasks", x); setEditing(null); }} />}
      </div>
    );
  }
  function TaskModal({ t, onClose, onSave }) {
    const [f, setF] = useState({ ...t });
    const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
    return (
      <Modal title={t.id ? "Editar tarea" : "Nueva tarea"} onClose={onClose}>
        <div className="space-y-3">
          <Field label="Tarea / seguimiento *"><input className={inputCls} value={f.titulo} onChange={(e) => set("titulo", e.target.value)} placeholder="Ej. Llamar para confirmar propuesta" autoFocus /></Field>
          <Field label="Vinculado a (empresa / oportunidad)"><input className={inputCls} value={f.vinculo} onChange={(e) => set("vinculo", e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Fecha límite"><input type="date" className={inputCls} value={f.fecha} onChange={(e) => set("fecha", e.target.value)} /></Field>
            <Field label="Prioridad"><select className={inputCls} value={f.prioridad} onChange={(e) => set("prioridad", e.target.value)}>{PRIORITIES.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}</select></Field>
          </div>
          <Field label="Responsable"><input className={inputCls} value={f.responsable} onChange={(e) => set("responsable", e.target.value)} /></Field>
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={onClose} className="rounded-lg px-4 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100">Cancelar</button>
            <button onClick={() => f.titulo.trim() && onSave({ ...f, id: f.id || uid() })} className="rounded-lg bg-[#1B3A6B] px-4 py-2 text-sm font-medium text-white hover:bg-[#132a4d]">Guardar</button>
          </div>
        </div>
      </Modal>
    );
  }

  /* ----------------------------------------------------------------- */
  /*  Calendario (vista-resumen, solo lectura)                         */
  /* ----------------------------------------------------------------- */
  function CalendarView({ data }) {
    const [ref, setRef] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
    const monthName = new Date(ref.y, ref.m, 1).toLocaleDateString("es-MX", { month: "long", year: "numeric" });
    const first = new Date(ref.y, ref.m, 1);
    const startDow = (first.getDay() + 6) % 7; // lunes = 0
    const daysInMonth = new Date(ref.y, ref.m + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);

    const events = useMemo(() => {
      const map = {};
      const add = (iso, ev) => { if (!iso) return; (map[iso] = map[iso] || []).push(ev); };
      data.tasks.forEach((t) => add(t.fecha, { type: "tarea", label: t.titulo, color: t.hecha ? "#94a3b8" : "#0d9488" }));
      data.opportunities.filter((o) => o.etapa === "cierre" || (!o.cierreAbierto && stageIdx(o.etapa) >= stageIdx("oportunidad"))).forEach((o) => { if (!o.cierreAbierto) add(o.cierre, { type: "cierre", label: o.nombre + " · " + fmtMXN(o.valor), color: stageOf(o.etapa).color }); });
      return map;
    }, [data]);

    const iso = (d) => ref.y + "-" + String(ref.m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const move = (dir) => setRef((r) => { let m = r.m + dir, y = r.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } return { y, m }; });
    const dows = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];

    return (
      <div className="space-y-4">
        <div className="flex items-center justify-between">
          <h2 className="text-base font-semibold capitalize text-slate-800">{monthName}</h2>
          <div className="flex items-center gap-2">
            <button onClick={() => setRef(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })} className="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-50">Hoy</button>
            <button onClick={() => move(-1)} className="rounded-lg border border-slate-200 bg-white p-1.5 text-slate-500 hover:bg-slate-50"><Icon n="chevL" s={16} /></button>
            <button onClick={() => move(1)} className="rounded-lg border border-slate-200 bg-white p-1.5 text-slate-500 hover:bg-slate-50"><Icon n="chevR" s={16} /></button>
          </div>
        </div>
        <div className="flex items-center gap-4 text-xs text-slate-500">
          <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-teal-600" /> Tareas / seguimientos</span>
          <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-violet-500" /> Cierres estimados</span>
        </div>
        <div className="overflow-hidden rounded-2xl border border-slate-200 bg-white">
          <div className="grid grid-cols-7 border-b border-slate-100 bg-slate-50">
            {dows.map((d) => <div key={d} className="py-2 text-center text-xs font-semibold text-slate-400">{d}</div>)}
          </div>
          <div className="grid grid-cols-7">
            {cells.map((d, i) => {
              const dayISO = d ? iso(d) : null;
              const evs = d ? (events[dayISO] || []) : [];
              const isToday = dayISO === todayISO();
              return (
                <div key={i} className={"min-h-[92px] border-b border-r border-slate-100 p-1.5 " + (d ? "" : "bg-slate-50/50")}>
                  {d && <div className={"mb-1 flex h-5 w-5 items-center justify-center rounded-full text-xs " + (isToday ? "bg-[#1B3A6B] font-semibold text-white" : "text-slate-400")}>{d}</div>}
                  <div className="space-y-1">
                    {evs.slice(0, 3).map((e, j) => (
                      <div key={j} className="truncate rounded px-1 py-0.5 text-[10px] font-medium text-white" style={{ backgroundColor: e.color }} title={e.label}>{e.label}</div>
                    ))}
                    {evs.length > 3 && <div className="px-1 text-[10px] text-slate-400">+{evs.length - 3} más</div>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
